# Codemagic — iOS build + TestFlight upload for the Tomodachi Capacitor shell.
# Set up once in the Codemagic UI:
#   • Team settings → Integrations → App Store Connect: add the API key
#     (.p8 + Key ID + Issuer ID) as integration name "tomodachi_asc".
#   • Automatic code signing uses that key to create/fetch the Distribution
#     certificate and the App Store profile for BUNDLE_ID.
# Trigger: manual (Start new build → this workflow) or on tag v*.
workflows:
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
      node: 22
      vars:
        BUNDLE_ID: "com.bytepluslife.tomodachi"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "0000000000"   # numeric App ID from App Store Connect → App Information (fill in)
      groups: []
    integrations:
      app_store_connect: tomodachi_asc
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci --no-fund --no-audit
      - name: Build www (prod env) + sync iOS
        script: |
          npm run build:www
          npx cap sync ios
      - name: Set up code signing (automatic, from the ASC API key)
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal
