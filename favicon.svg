<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tomodachi">
  <title>Tomodachi</title>
  <!-- Warm paper background — keeps the mark visible on light AND dark browser tabs -->
  <rect width="100" height="100" rx="22" fill="#FAF8F2"/>
  <!-- Scarf back shadow -->
  <path d="M 13 50
           C 13 75, 47 85, 50 85
           C 53 85, 87 75, 87 50
           L 87 60
           C 87 86, 53 95, 50 95
           C 47 95, 13 86, 13 60 Z" fill="#7F1D1D"/>
  <!-- Scarf front (solid crimson) -->
  <path d="M 13 50
           C 13 75, 47 85, 50 85
           C 53 85, 87 75, 87 50
           L 87 57
           C 87 84, 53 93, 50 93
           C 47 93, 13 84, 13 57 Z" fill="#B91C1C"/>
  <!-- Left tail (deep, matches right) -->
  <path d="M 15 72 C 11 80, 9 88, 6 95 L 13 88 L 16 95 L 20 78 Z" fill="#7F1D1D"/>
  <!-- Right tail -->
  <path d="M 85 72 C 89 80, 91 88, 94 95 L 87 88 L 84 95 L 80 78 Z" fill="#7F1D1D"/>
  <!-- 友 character above the cradle -->
  <text x="50" y="60" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-weight="900" font-size="50" text-anchor="middle" fill="#18181B">友</text>
</svg>
